# Configure a SEPARATE Cloudflare Worker from Charles Fan Club.
name = "oats-and-more-voting"
main = "src/index.js"
compatibility_date = "2026-11-10"

[[d1_databases]]
binding = "DB"
database_name = "oats-and-more-votes"
database_id = "765a99c9-bb66-43e4-8d86-043bc2c47c8b"

# Never put ADMIN_TOKEN here. Use npx wrangler secret put ADMIN_TOKEN.

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
