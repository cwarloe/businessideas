name: Validate decision history

on:
  pull_request:
    paths:
      - 'experiments/**'
      - 'docs/data/decision-history.json'
      - 'docs/decision-history.html'
      - 'scripts/validate-decision-history.mjs'
      - 'scripts/validate-experiments.mjs'
      - 'scripts/test-validate-experiments.mjs'
      - 'scripts/source-reference.mjs'
      - 'scripts/test-source-reference.mjs'
      - 'playbook/decision-history-format.md'
      - '.github/workflows/validate-decision-history.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - 'docs/data/decision-history.json'
      - 'docs/decision-history.html'
      - 'scripts/validate-decision-history.mjs'
      - 'scripts/validate-experiments.mjs'
      - 'scripts/test-validate-experiments.mjs'
      - 'scripts/source-reference.mjs'
      - 'scripts/test-source-reference.mjs'
      - 'playbook/decision-history-format.md'
      - '.github/workflows/validate-decision-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate structured history and source links
        run: node scripts/validate-decision-history.mjs
      - name: Validate proposed experiments without inventing field results
        run: node scripts/validate-experiments.mjs
      - name: Exercise fail-closed traveler, source-reference and measurement cases
        run: node --test scripts/test-validate-experiments.mjs scripts/test-source-reference.mjs
