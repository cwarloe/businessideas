name: Verify live site

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 15 * * 1"
  workflow_dispatch:

# Read-only verification. A failure is surfaced as a failed GitHub Actions run.
permissions:
  contents: read

concurrency:
  group: verify-live-site
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare source with published GitHub Pages files
        run: bash .github/scripts/verify-live-site.sh
